server:
  port: 8080

spring:
  application:
    name: hospital-bed-transfer-service
  datasource:
    url: jdbc:h2:mem:hospital_transfer;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

logging:
  level:
    com.hospital.transfer: INFO
    org.hibernate.SQL: WARN
